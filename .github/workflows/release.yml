name: Release

# Push a tag like v0.1.0 to build installers for Windows and macOS and
# publish them as a release in the public repository finance_app_public.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles msi,nsis"
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          # Fine-grained PAT with Contents: Read & Write on finance_app_public only.
          GITHUB_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: kostyanpilkin-hash
          repo: finance_app_public
          tagName: ${{ github.ref_name }}
          releaseName: "Финансы ${{ github.ref_name }}"
          releaseBody: "Установщики для Windows (.msi / -setup.exe) и macOS (.dmg, Apple Silicon + Intel). Инструкция по установке без подписи — в README."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
