name: Release

# Push a tag like v0.1.0 to build installers for Windows and macOS and
# publish them as a release in the public repository finance_app_public.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release version tag
        required: true
        default: v0.1.0
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Prepare public draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" == v* ]] || { echo "Run this workflow on a version tag"; exit 1; }
          REPO=kostyanpilkin-hash/finance_app_public
          SHA=$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')
          RELEASES=$(gh api --paginate "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [[ -z "$RELEASES" ]]; then
            RELEASES=$(gh api --method POST "repos/$REPO/releases" \
              -f tag_name="$TAG" -f target_commitish="$SHA" \
              -f name="Финансы $TAG" -f body="Установщики для Windows и macOS." \
              -F draft=true --jq '.id')
          fi
          [[ "$RELEASES" =~ ^[0-9]+$ ]]
          echo "id=$RELEASES" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles msi,nsis"
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}

      - run: npm ci

      # Tag the public repo's main so the release doesn't need target_commitish
      # (GitHub 422s on it when the tag doesn't exist in the target repo yet).

      - uses: tauri-apps/tauri-action@v0
        env:
          # Fine-grained PAT with Contents: Read & Write on finance_app_public only.
          GITHUB_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: kostyanpilkin-hash
          repo: finance_app_public
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: "Финансы ${{ inputs.release_tag || github.ref_name }}"
          releaseBody: "Установщики для Windows (.msi / -setup.exe) и macOS (.dmg, Apple Silicon + Intel). Инструкция по установке без подписи — в README."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
