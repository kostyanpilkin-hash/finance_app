[package]
name = "finance-app"
description = "Finance — family budget desktop app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "finance_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
finance-core.workspace = true
finance-storage.workspace = true
finance-api.workspace = true
finance-bot.workspace = true
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "=2.4.3"
serde.workspace = true
serde_json.workspace = true
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
dirs = "6"
base64 = "0.22"
mdns-sd = "0.21.7"
hostname = "0.4.2"
