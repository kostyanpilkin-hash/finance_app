[workspace]
resolver = "2"
members = ["crates/core", "crates/storage", "crates/api", "src-tauri"]

[workspace.package]
version = "0.1.10"
edition = "2021"
authors = ["Finance"]
license = "UNLICENSED"

[workspace.dependencies]
finance-core = { path = "crates/core" }
finance-storage = { path = "crates/storage" }
finance-api = { path = "crates/api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
